name: Gradle tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '26'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare JavaFX display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0t64

      - name: Build and Run tests
        run: xvfb-run -a ./gradlew build --no-daemon