name: Gradle tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Prepare JavaFX display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0t64

      - name: Run tests
        run: xvfb-run -a ./gradlew --no-daemon test
